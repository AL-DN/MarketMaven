{% extends "blog/base.html" %} {% block content%} {% load crispy_forms_tags %}
<div class="content-section">
  <div class="text-center mb-4">
    <i class="fas fa-sign-in-alt text-primary" style="font-size: 3rem;"></i>
    <h2 class="mt-3">Welcome Back</h2>
    <p class="text-muted">Sign in to your MarketMaven account</p>
  </div>
  
  <form method="POST">
    {% csrf_token %}
    <fieldset class="form-group">
      {{ form|crispy }}
    </fieldset>
    <div class="form-group">
      <button class="btn btn-primary btn-lg btn-block" type="submit">
        <i class="fas fa-sign-in-alt mr-2"></i>Sign In
      </button>
      <div class="text-center mt-3">
        <small class="text-muted">
          <a href="{% url 'password_reset' %}" class="text-decoration-none">
            <i class="fas fa-key mr-1"></i>Forgot Password?
          </a>
        </small>
      </div>
    </div>
  </form>
  
  <div class="border-top pt-4 text-center">
    <small class="text-muted">
      Don't have an account?
      <a class="ml-2 text-primary font-weight-bold" href="{% url 'register' %}">
        <i class="fas fa-user-plus mr-1"></i>Sign Up Now
      </a>
    </small>
  </div>
</div>

{%endblock content%}
