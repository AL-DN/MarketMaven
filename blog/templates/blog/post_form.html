{% extends "blog/base.html" %} {% load crispy_forms_tags %} {% block content%}
<div class="content-section">
  <div class="d-flex align-items-center mb-4">
    <i class="fas fa-edit text-primary mr-3" style="font-size: 1.5rem;"></i>
    <h2 class="mb-0">Create New Position</h2>
  </div>
  
  <form method="POST">
    {% csrf_token %}
    <fieldset class="form-group">
      <div class="form-row">
        <div class="col-md-6">
          <label class="form-label font-weight-bold">
            <i class="fas fa-chart-line mr-2"></i>Symbol
          </label>
          {{ form.symbol }}
        </div>
        <div class="col-md-6">
          <label class="form-label font-weight-bold">
            <i class="fas fa-exchange-alt mr-2"></i>Side
          </label>
          {{ form.side }}
        </div>
      </div>
      
      <div class="form-group mt-3">
        <label class="form-label font-weight-bold">
          <i class="fas fa-align-left mr-2"></i>Content
        </label>
        {{ form.content }}
      </div>
    </fieldset>
    
    <div class="form-group mt-4">
      <button class="btn btn-primary btn-lg" type="submit">
        <i class="fas fa-paper-plane mr-2"></i>Post Position
      </button>
      <a href="{% url 'blog-home' %}" class="btn btn-outline-secondary btn-lg ml-2">
        <i class="fas fa-arrow-left mr-2"></i>Cancel
      </a>
    </div>
  </form>
</div>

{%endblock content%}
