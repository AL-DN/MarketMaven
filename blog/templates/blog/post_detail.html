{% extends "blog/base.html" %} {% block content %}
<div class="post-list">
  <article class="media content-section">
    <a href="{% url 'user-profile' object.author.username %}">
      <img
        class="rounded-circle article-img"
        src="{{ post.author.profile.image.url }}"
      />
    </a>
    <div class="media-body">
      <div class="article-metadata">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <a class="mr-2" href="{% url 'user-post' object.author.username %}">
              <i class="fas fa-user mr-1"></i>{{ object.author }}
            </a>
            <small class="text-muted">
              <i class="fas fa-clock mr-1"></i>{{ object.date_posted }}
            </small>
          </div>
          {% if object.author == user %}
          <div class="btn-group" role="group">
            <a
              class="btn btn-outline-primary btn-sm"
              href="{% url 'post-update' object.id %}"
            >
              <i class="fas fa-edit mr-1"></i>Update
            </a>
            <a
              class="btn btn-outline-danger btn-sm"
              href="{% url 'post-delete' object.id %}"
            >
              <i class="fas fa-trash mr-1"></i>Delete
            </a>
          </div>
          {%endif%}
        </div>
      </div>
      
      <div class="mt-3">
        <h2 class="article-title d-flex align-items-center">
          <i class="fas fa-chart-line mr-3 text-primary"></i>
          {{ object.symbol }}
        </h2>
        <div class="article-content mt-3 p-3" style="background: #f8f9fa; border-radius: 8px; border-left: 4px solid var(--accent-gold);">
          {{ object.content }}
        </div>
      </div>
    </div>
  </article>
</div>
{% endblock content %}
